name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # specs/n11 is generated from two committed inputs (scripts/specs/n11/source.mjs and
      # probe-snapshots/n11.json), so unlike Trendyol's portal capture the check needs no
      # network: it fails when either input changed without `pnpm specs:n11:build`.
      - name: n11 specs up to date
        if: matrix.node == 22
        run: pnpm specs:n11:check

      - name: Build
        run: pnpm build

      # Every internal link and asset in the built docs must resolve (catches pages that
      # TypeDoc/Starlight stop generating, and hand-written links to moved pages).
      - name: Docs link check
        if: matrix.node == 22
        run: pnpm docs:check-links

      # Roadmap 4.3: SDK TypeScript response types vs specs/ (offline, reads committed files only).
      # Warn-only: the report goes to the job summary and never fails the job. One matrix leg is
      # enough — the result does not depend on the Node version.
      - name: SDK types vs specs (warn-only)
        if: matrix.node == 22
        continue-on-error: true
        run: |
          pnpm drift:types --fail-on never
          cat drift-output/types-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package health (publint + attw)
        run: pnpm health:packages

      - name: API surface check
        run: pnpm api:check

      - name: Test (with coverage thresholds)
        run: pnpm test:coverage
